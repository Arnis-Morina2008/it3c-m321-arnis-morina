spring:
  application:
    name: batch-writer
  rabbitmq:
    # Im Docker-Netzwerk heisst der Host "rabbitmq", lokal "localhost"
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  datasource:
    # Im Docker-Netzwerk heisst der Host "postgres", lokal "localhost"
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:guest}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Ist die Datenbank weg, nach 5 s aufgeben statt nach den vorgegebenen 30 s.
      # Dann gibt der batch-writer die Nachrichten zurueck in die Queue und versucht
      # es erneut (Szenario S7, Spezifikation 4.5).
      connection-timeout: 5000

logging:
  level:
    # Im Unterricht wollen wir die Batch-Inserts und RabbitMQ-Logs genau sehen
    ch.benedict.m321: DEBUG
